<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="High School Student Management System Portal" />
    <title>Login | Student Management System</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body class="login-page">
    <div class="login-screen-full">
        <div class="login-container">
            <div class="login-left">
                <div class="login-branding">
                    <div class="brand-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                    <h1>Student Management System</h1>
                    <p>Welcome to your academic portal. Sign in to access your dashboard, grades, and more.</p>
                </div>
                <div class="login-illustration">
                    <svg viewBox="0 0 400 300" fill="none">
                        <circle cx="200" cy="150" r="120" fill="#667eea" opacity="0.1"/>
                        <path d="M150 100 L250 100 L250 200 L150 200 Z" fill="#667eea" opacity="0.2"/>
                        <circle cx="200" cy="150" r="60" fill="#764ba2" opacity="0.3"/>
                    </svg>
                </div>
            </div>
            
            <div class="login-right">
                <div class="login-card-modern">
                    <h2>Sign In</h2>
                    <p class="login-subtitle">Enter your credentials to access your account</p>
                    
                    <form id="loginForm" class="login-form-modern">
                        <div class="form-group">
                            <label class="form-label" for="loginUsername">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                                Username
                            </label>
                            <input type="text" id="loginUsername" class="text-input" placeholder="Enter your username" autocomplete="username" required />
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="loginPassword">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0110 0v4" />
                                </svg>
                                Password
                            </label>
                            <input type="password" id="loginPassword" class="text-input" placeholder="Enter your password" autocomplete="current-password" required />
                        </div>

                        <p class="login-error" id="loginError"></p>

                        <button class="btn btn-primary btn-full btn-login" type="submit">
                            <span>Sign In</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                    </form>

                    <div class="login-footer">
                        <p>Need help? Contact your administrator</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_BASE_URL: 'http://localhost:5000/api',
            AUTH_TOKEN_KEY: 'sms_auth_token',
            AUTH_USER_KEY: 'sms_auth_user',
        };

        const loginForm = document.getElementById('loginForm');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginError.textContent = '';

            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Username and password are required.';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    loginError.textContent = data?.message || 'Invalid username or password.';
                    return;
                }

                // Store auth data
                localStorage.setItem(CONFIG.AUTH_TOKEN_KEY, data.data.token);
                localStorage.setItem(CONFIG.AUTH_USER_KEY, JSON.stringify(data.data.user));

                // Redirect based on role
                const role = data.data.user.role;
                if (role === 'student') {
                    window.location.href = 'student.html';
                } else if (role === 'teacher') {
                    window.location.href = 'teacher.html';
                } else if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    loginError.textContent = 'Unknown user role.';
                }

            } catch (error) {
                loginError.textContent = error.message || 'Unable to sign in. Please try again.';
                console.error('Login error:', error);
            }
        });

        // Check if already logged in
        const token = localStorage.getItem(CONFIG.AUTH_TOKEN_KEY);
        const user = JSON.parse(localStorage.getItem(CONFIG.AUTH_USER_KEY) || 'null');

        if (token && user) {
            // Redirect to appropriate dashboard
            if (user.role === 'student') {
                window.location.href = 'student.html';
            } else if (user.role === 'teacher') {
                window.location.href = 'teacher.html';
            } else if (user.role === 'admin') {
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
